const sv=()=>{try{localStorage.setItem('sr',JSON.stringify({q:$('qSel').selectedIndex,s:SENS,a:ACC,au:AUTO}))}catch(e){}};
try{const o=JSON.parse(localStorage.getItem('sr')||'{}');if(o.s)SENS=o.s;ACC=o.a||0;AUTO=o.au!==false;$('qSel').selectedIndex=o.q??1}catch(e){}
$('sSl').value=SENS;$('aSl').value=ACC;$('aRes').checked=AUTO;$('sVal').textContent=SENS.toFixed(2);
$('qSel').onchange=()=>{applyQ($('qSel').selectedIndex);sv()};
$('sSl').oninput=e=>{SENS=+e.target.value;$('sVal').textContent=SENS.toFixed(2);sv()};
$('aSl').oninput=e=>{ACC=+e.target.value;sv()};$('aRes').onchange=e=>{AUTO=e.target.checked;sv()};
applyQ($('qSel').selectedIndex);
</script></body></html>
